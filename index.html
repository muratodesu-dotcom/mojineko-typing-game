<!DOCTYPE html>
<html lang="ja" data-lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23c2414d%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2738%27 text-anchor=%27middle%27 font-family=%27sans-serif%27 font-weight=%27700%27 fill=%27%23fff%27%3E言%3C/text%3E%3C/svg%3E">
  <title>Kotoba Type</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('kotoba-type:v2') || '{}');
        var t = s.settings && s.settings.theme;
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (s.settings && s.settings.lang) { document.documentElement.dataset.lang = s.settings.lang; document.documentElement.lang = s.settings.lang; }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Fonts are optional: loaded without blocking render, falling back to system CJK fonts. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand-home" role="button" tabindex="0">
      <span class="brand-mark">言</span>
      <span class="brand-name">Kotoba Type</span>
    </div>
    <div class="topbar-right">
      <div class="pill" id="pill-streak"><span class="dot"></span><b id="streak-count">0</b><span id="streak-label"></span></div>
      <div class="pill" id="pill-level">
        <b><span data-t="lv"></span><span id="level-num">1</span></b>
        <span id="level-title"></span>
        <span class="xp-bar"><span id="xp-fill"></span></span>
      </div>
      <button class="icon-btn" id="btn-theme" aria-label="theme"></button>
      <button class="icon-btn" id="btn-sound" aria-label="sound"></button>
    </div>
  </header>

  <main>
    <!-- ================= HOME ================= -->
    <section class="screen active" id="screen-home">
      <div class="home-grid">
        <div class="setup">
          <h1 class="hero-title" data-t="heroTitle"></h1>
          <p class="hero-sub" data-t="heroSub"></p>

          <div class="field">
            <label data-t="language"></label>
            <div class="lang-cards">
              <button class="lang-card" data-lang="ja"><span class="lang-glyph">あ</span><span class="lang-name">日本語</span></button>
              <button class="lang-card" data-lang="ko"><span class="lang-glyph">한</span><span class="lang-name">한국어</span></button>
            </div>
          </div>

          <div class="field">
            <label id="input-label"></label>
            <div class="chips" id="input-chips"></div>
            <p class="hint" id="input-hint"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <label data-t="mode"></label>
              <div class="chips" id="mode-chips">
                <button class="chip" data-mode="time" data-t="modeTime"></button>
                <button class="chip" data-mode="sprint" data-t="modeSprint"></button>
              </div>
            </div>
            <div class="field" id="field-duration">
              <label data-t="duration"></label>
              <div class="chips" id="duration-chips">
                <button class="chip" data-duration="30">30<small data-t="sec"></small></button>
                <button class="chip" data-duration="60">60<small data-t="sec"></small></button>
                <button class="chip" data-duration="120">120<small data-t="sec"></small></button>
              </div>
            </div>
            <div class="field" id="field-sprint" hidden>
              <label data-t="sentenceCount"></label>
              <div class="chips" id="sprint-chips">
                <button class="chip" data-sprint="5">5<small data-t="sentencesUnit"></small></button>
                <button class="chip" data-sprint="10">10<small data-t="sentencesUnit"></small></button>
                <button class="chip" data-sprint="20">20<small data-t="sentencesUnit"></small></button>
              </div>
            </div>
          </div>

          <div class="field">
            <label data-t="difficulty"></label>
            <div class="chips" id="level-chips">
              <button class="chip" data-level="mixed" data-t="levelMixed"></button>
              <button class="chip" data-level="1" data-t="level1"></button>
              <button class="chip" data-level="2" data-t="level2"></button>
              <button class="chip" data-level="3" data-t="level3"></button>
            </div>
          </div>

          <div class="field toggles">
            <label class="toggle" id="toggle-guide"><input type="checkbox" id="opt-guide"> <span data-t="optGuide"></span></label>
            <label class="toggle" id="toggle-keyboard"><input type="checkbox" id="opt-keyboard"> <span data-t="optKeyboard"></span></label>
            <label class="toggle"><input type="checkbox" id="opt-translation"> <span data-t="optTranslation"></span></label>
          </div>

          <button class="btn-primary" id="btn-start"><span data-t="start"></span><kbd>Enter</kbd></button>
        </div>

        <aside class="side">
          <div class="panel">
            <h2 data-t="stats"></h2>
            <div class="stat-grid" id="home-stats"></div>
          </div>
          <div class="panel">
            <h2><span data-t="leaderboard"></span><small id="board-label"></small></h2>
            <ol class="board" id="home-board"></ol>
          </div>
          <div class="panel">
            <h2><span data-t="achievements"></span><small id="ach-count"></small></h2>
            <div class="ach-grid" id="ach-grid"></div>
          </div>
          <button class="btn-text danger" id="btn-reset" data-t="reset"></button>
        </aside>
      </div>
    </section>

    <!-- ================= PLAY ================= -->
    <section class="screen" id="screen-play">
      <div class="hud">
        <div class="hud-item"><span class="hud-label" id="hud-time-label"></span><span class="hud-value" id="hud-time">60</span></div>
        <div class="hud-item"><span class="hud-label" data-t="hudScore"></span><span class="hud-value" id="hud-score">0</span></div>
        <div class="hud-item combo"><span class="hud-label" data-t="hudCombo"></span><span class="hud-value" id="hud-combo">0</span></div>
        <div class="hud-item"><span class="hud-label" id="hud-speed-label"></span><span class="hud-value" id="hud-speed">0</span></div>
        <div class="hud-item"><span class="hud-label" data-t="hudAcc"></span><span class="hud-value" id="hud-acc">100%</span></div>
      </div>
      <div class="timebar"><div id="timebar-fill"></div></div>

      <div class="stage" id="stage">
        <div class="countdown" id="countdown" hidden>3</div>
        <div class="sentence-card" id="sentence-card">
          <div class="progress-dots" id="progress-dots"></div>
          <div class="sentence-main" id="sentence-main"></div>
          <div class="sentence-guide" id="sentence-guide"></div>
          <div class="sentence-en" id="sentence-en"></div>
          <input class="direct-input" id="direct-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" hidden>
        </div>
        <div class="float-layer" id="float-layer"></div>
      </div>

      <div class="keyboard" id="keyboard"></div>
      <p class="play-hint" id="play-hint"></p>
    </section>

    <!-- ================= RESULT ================= -->
    <section class="screen" id="screen-result">
      <div class="result-wrap">
        <div class="result-rank-wrap">
          <div class="result-rank" id="result-rank">S</div>
          <div class="result-rank-label" id="result-rank-label"></div>
        </div>
        <div class="result-score">
          <span class="result-score-label" data-t="score"></span>
          <span class="result-score-value" id="result-score">0</span>
          <span class="new-record" id="new-record" hidden></span>
        </div>
        <div class="stat-grid result-stats" id="result-stats"></div>
        <div class="result-ach" id="result-ach" hidden></div>
        <div class="panel result-board">
          <h2><span data-t="leaderboard"></span><small id="result-board-label"></small></h2>
          <ol class="board" id="result-board"></ol>
        </div>
        <div class="result-actions">
          <button class="btn-primary" id="btn-retry"><span data-t="retry"></span><kbd>Enter</kbd></button>
          <button class="btn-text" id="btn-home" data-t="home"></button>
        </div>
      </div>
    </section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast-layer" id="toast-layer"></div>

  <script src="js/data/ja.js"></script>
  <script src="js/data/ko.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/hangul.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

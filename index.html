  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "もじねこ！",

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('kotoba-type:v2') || '{}');
        var t = s.settings && s.settings.theme;
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (s.settings && s.settings.lang) { document.documentElement.dataset.lang = s.settings.lang; document.documentElement.lang = s.settings.lang; }
        if (s.settings && s.settings.font) document.documentElement.dataset.font = s.settings.font;
        if (s.settings && s.settings.textSize) document.documentElement.dataset.size = s.settings.textSize;
      } catch (e) {}
    })();
  </script>

<body>
  <noscript>
    <p>もじねこ！は日本語・韓国語・英語のタイピング練習ゲームです。ひらがな・漢字混じり・한국어（2벌식）・English に対応し、スコア・ランク・実績・連続記録で毎日の練習を続けやすくします。プレイには JavaScript を有効にしてください。</p>
  </noscript>
  <header class="topbar">
    <div class="brand" id="brand-home" role="button" tabindex="0">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">もじねこ！</span><span class="brand-heart" aria-hidden="true"></span>
    </div>
    <div class="topbar-right">
      <div class="pill" id="pill-streak"><span class="dot"></span><b id="streak-count">0</b><span id="streak-label"></span></div>
      <div class="pill" id="pill-level">
        <b><span data-t="lv"></span><span id="level-num">1</span></b>
        <span id="level-title"></span>
        <span class="xp-bar"><span id="xp-fill"></span></span>
      </div>
      <button class="icon-btn" id="btn-help" aria-label="about"></button>
      <button class="icon-btn" id="btn-settings" aria-label="settings"></button>
      <button class="icon-btn" id="btn-theme" aria-label="theme"></button>
      <button class="icon-btn" id="btn-sound" aria-label="sound"></button>
    </div>
  </header>

  <main>
    <!-- ================= HOME ================= -->
    <section class="screen active" id="screen-home">
      <div class="home-grid">
        <div class="setup">
          <div class="hero">
            <div>
              <h1 class="hero-title" data-t="heroTitle">タイピング練習</h1>
              <p class="hero-sub" data-t="heroSub">言語を選んでスタート。ハイスコアを目指そう。</p>
            </div>
            <div class="mascot" id="mascot-home" role="button" tabindex="0"></div>
          </div>

          <div class="field">
            <label data-t="language"></label>
            <div class="lang-cards" data-nav>
              <button class="lang-card" data-lang="ja"><span class="lang-glyph">あ</span><span class="lang-name">日本語</span></button>
              <button class="lang-card" data-lang="ko"><span class="lang-glyph">한</span><span class="lang-name">한국어</span></button>
              <button class="lang-card" data-lang="en"><span class="lang-glyph">A</span><span class="lang-name">English</span></button>
            </div>
          </div>

          <div class="field">
            <label id="input-label"></label>
            <div class="chips" id="input-chips" data-nav></div>
            <p class="hint" id="input-hint"></p>
          </div>

          <div class="field">
            <label data-t="mode"></label>
            <div class="chips" id="mode-chips" data-nav>
              <button class="chip" data-mode="time" data-t="modeTime"></button>
              <button class="chip" data-mode="sprint" data-t="modeSprint"></button>
              <button class="chip" data-mode="daily" data-t="modeDaily"></button>
              <button class="chip" data-mode="drill" data-t="modeDrill"></button>
              <button class="chip" data-mode="paragraph" data-t="modeParagraph"></button>
            </div>
            <p class="hint" id="mode-hint"></p>
          </div>

          <div class="field-row">
            <div class="field" id="field-duration">
              <label data-t="duration"></label>
              <div class="chips" id="duration-chips" data-nav>
                <button class="chip" data-duration="30">30<small data-t="sec"></small></button>
                <button class="chip" data-duration="60">60<small data-t="sec"></small></button>
                <button class="chip" data-duration="120">120<small data-t="sec"></small></button>
              </div>
            </div>
            <div class="field" id="field-sprint" hidden>
              <label data-t="sentenceCount"></label>
              <div class="chips" id="sprint-chips" data-nav>
                <button class="chip" data-sprint="5">5<small data-t="sentencesUnit"></small></button>
                <button class="chip" data-sprint="10">10<small data-t="sentencesUnit"></small></button>
                <button class="chip" data-sprint="20">20<small data-t="sentencesUnit"></small></button>
              </div>
            </div>
          </div>

          <div class="field" id="field-pack">
            <label data-t="pack"></label>
            <div class="chips" id="pack-chips" data-nav></div>
            <p class="hint" id="pack-hint"></p>
            <div class="custom-editor" id="custom-editor" hidden>
              <textarea id="custom-text" rows="5" spellcheck="false"></textarea>
              <div class="custom-actions">
                <span class="hint" id="custom-help"></span>
                <button class="chip" id="btn-custom-save" data-t="customSave"></button>
              </div>
            </div>
          </div>

          <div class="field" id="field-level">
            <label data-t="difficulty"></label>
            <div class="chips" id="level-chips" data-nav>
              <button class="chip" data-level="mixed" data-t="levelMixed"></button>
              <button class="chip" data-level="1" data-t="level1"></button>
              <button class="chip" data-level="2" data-t="level2"></button>
              <button class="chip" data-level="3" data-t="level3"></button>
            </div>
          </div>

          <button class="btn-primary" id="btn-start"><span data-t="start"></span><kbd>Enter</kbd></button>
        </div>

        <aside class="side">
          <div class="side-tabs" id="side-tabs" data-nav>
            <button class="chip" data-tab="overview" data-t="tabOverview"></button>
            <button class="chip" data-tab="records" data-t="tabRecords"></button>
            <button class="chip" data-tab="goals" data-t="goals"></button>
            <button class="chip" data-tab="board" data-t="leaderboard"></button>
            <button class="chip" data-tab="ach" data-t="achievements"></button>
          </div>
          <div class="panel side-panel" data-panel="overview">
            <h2 data-t="stats"></h2>
            <div class="stat-grid" id="home-stats"></div>
            <h2 class="mt" data-t="mascotTitle"></h2>
            <div class="mascot-growth"><div class="mascot" id="mascot-preview"></div><div class="hint" id="mascot-next"></div></div>
          </div>
          <div class="panel side-panel" data-panel="records" hidden>
            <h2><span data-t="history"></span><small id="history-label"></small></h2>
            <div class="history" id="history-chart"></div>
            <ol class="board history-list" id="history-list"></ol>
            <h2 class="mt"><span data-t="dailyTitle"></span><small id="daily-label"></small></h2>
            <ol class="board" id="daily-list"></ol>
          </div>
          <div class="panel side-panel" data-panel="goals" hidden>
            <h2 data-t="goals"></h2>
            <div class="goals" id="goals"></div>
          </div>
          <div class="panel side-panel" data-panel="board" hidden>
            <h2><span data-t="leaderboard"></span><small id="board-label"></small></h2>
            <ol class="board" id="home-board"></ol>
          </div>
          <div class="panel side-panel" data-panel="ach" hidden>
            <h2><span data-t="achievements"></span><small id="ach-count"></small></h2>
            <div class="ach-grid" id="ach-grid"></div>
          </div>
        </aside>
      </div>
      <div class="cheer" id="cheer-home">
        <span class="cheer-avatar" aria-hidden="true">ム</span>
        <span class="balloon" id="cheer-home-text"></span>
      </div>
    </section>

    <!-- ================= PLAY ================= -->
    <section class="screen" id="screen-play">
      <div class="hud">
        <div class="hud-item"><span class="hud-label" id="hud-time-label"></span><span class="hud-value" id="hud-time">60</span></div>
        <div class="hud-item"><span class="hud-label" data-t="hudScore"></span><span class="hud-value" id="hud-score">0</span></div>
        <div class="hud-item combo"><span class="hud-label" data-t="hudCombo"></span><span class="hud-value" id="hud-combo">0</span></div>
        <div class="hud-item"><span class="hud-label" id="hud-speed-label"></span><span class="hud-value" id="hud-speed">0</span></div>
        <div class="hud-item"><span class="hud-label" data-t="hudAcc"></span><span class="hud-value" id="hud-acc">100%</span></div>
        <div class="hud-item ghost" id="hud-ghost-box" hidden><span class="hud-label" data-t="ghost"></span><span class="hud-value" id="hud-ghost">±0</span></div>
      </div>
      <div class="timebar"><div id="timebar-fill"></div><div id="ghost-marker" hidden></div></div>

      <div class="stage" id="stage">
        <div class="countdown" id="countdown" hidden>3</div>
        <div class="sentence-card" id="sentence-card">
          <div class="mascot card-mascot" id="mascot-play" role="button" tabindex="0"></div>
          <div class="progress-dots" id="progress-dots"></div>
          <div class="sentence-main" id="sentence-main"></div>
          <div class="sentence-reading" id="sentence-reading"></div>
          <div class="sentence-guide" id="sentence-guide"></div>
          <div class="sentence-en" id="sentence-en"></div>
          <input class="direct-input" id="direct-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" hidden>
        </div>
        <div class="float-layer" id="float-layer"></div>
      </div>

      <div class="keyboard" id="keyboard"></div>
      <p class="play-hint" id="play-hint"></p>
    </section>

    <!-- ================= RESULT ================= -->
    <section class="screen" id="screen-result">
      <div class="result-wrap">
        <div class="result-rank-wrap">
          <div class="result-rank" id="result-rank">S</div>
          <div class="result-rank-label" id="result-rank-label"></div>
        </div>
        <div class="result-score">
          <span class="result-score-label" data-t="score"></span>
          <span class="result-score-value" id="result-score">0</span>
          <span class="new-record" id="new-record" hidden></span>
        </div>
        <div class="stat-grid result-stats" id="result-stats"></div>
        <div class="panel result-weak" id="result-weak" hidden>
          <h2 data-t="weakTitle"></h2>
          <div class="weak-chips" id="weak-chips"></div>
        </div>
        <div class="result-ach" id="result-ach" hidden></div>
        <div class="panel result-board">
          <h2><span data-t="leaderboard"></span><small id="result-board-label"></small></h2>
          <ol class="board" id="result-board"></ol>
        </div>
        <div class="result-actions">
          <button class="btn-primary" id="btn-retry"><span data-t="retry"></span><kbd>Enter</kbd></button>
          <div class="result-links">
            <button class="btn-text" id="btn-share" data-t="share"></button>
            <button class="btn-text" id="btn-home" data-t="home"></button>
          </div>
        </div>
        <div class="cheer" id="cheer-result">
          <span class="cheer-avatar" aria-hidden="true">ム</span>
          <span class="balloon" id="cheer-result-text"></span>
          </div>
      </div>
      <canvas id="share-canvas" width="640" height="360" hidden></canvas>
    </section>
  </main>

  <dialog class="settings" id="settings-modal">
    <div class="settings-head">
      <h2 data-t="settingsTitle"></h2>
      <button class="icon-btn" id="btn-settings-close" aria-label="close">✕</button>
    </div>
    <div class="settings-body">
      <div class="field">
        <label data-t="pet"></label>
        <div class="chips pet-chips" id="pet-chips" data-nav></div>
      </div>
      <div class="field">
        <label data-t="font"></label>
        <div class="chips" id="font-chips" data-nav></div>
      </div>
      <div class="field">
        <label data-t="textSize"></label>
        <div class="chips" id="size-chips" data-nav></div>
      </div>
      <div class="field toggles">
        <label class="toggle" id="toggle-guide"><input type="checkbox" id="opt-guide"> <span data-t="optGuide"></span></label>
        <label class="toggle" id="toggle-keyboard"><input type="checkbox" id="opt-keyboard"> <span data-t="optKeyboard"></span></label>
        <label class="toggle" id="toggle-strict"><input type="checkbox" id="opt-strict"> <span data-t="optStrict"></span></label>
        <label class="toggle" id="toggle-furigana"><input type="checkbox" id="opt-furigana"> <span data-t="optFurigana"></span></label>
        <label class="toggle" id="toggle-hide-input"><input type="checkbox" id="opt-hide-input"> <span data-t="optHideInput"></span></label>
        <label class="toggle"><input type="checkbox" id="opt-translation"> <span data-t="optTranslation"></span></label>
      </div>
      <div class="field">
        <label data-t="volume"></label>
        <label class="toggle volume"><input type="range" id="opt-volume" min="0" max="100" step="5"></label>
      </div>
      <div class="field">
        <label data-t="dataTitle"></label>
        <div class="data-actions">
          <button class="chip" id="btn-export" data-t="exportData"></button>
          <button class="chip" id="btn-import" data-t="importData"></button>
          <input type="file" id="import-file" accept="application/json" hidden>
          <button class="chip danger" id="btn-reset" data-t="reset"></button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="settings about" id="about-modal">
    <div class="settings-head">
      <h2 data-t="aboutTitle"></h2>
      <button class="icon-btn" id="btn-about-close" aria-label="close">✕</button>
    </div>
    <div class="settings-body about-body" id="about-body"></div>
  </dialog>

  <footer class="footer"><span data-t="madeBy"></span></footer>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast-layer" id="toast-layer"></div>

  <script src="js/data/ja.js"></script>
  <script src="js/data/ko.js"></script>
  <script src="js/data/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/hangul.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
